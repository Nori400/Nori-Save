<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>下载视频 · Nori Save</title>
    <link rel="stylesheet" href="download.css" />
    <script type="module" src="download.js"></script>
  </head>
  <body>
    <header class="page-header"><div class="brand"><img src="icons/icon.svg" width="32" height="32" alt="" /><span>Nori Save</span></div><span class="header-label">视频下载</span></header>
    <main class="download-layout">
      <div class="overline">FROM A LINK, TO YOUR COMPUTER</div>
      <h1 id="job-title">正在准备视频</h1>
      <p id="job-subtitle" class="job-subtitle">正在读取下载信息…</p>

      <section class="progress-card" aria-label="视频下载进度">
        <div class="progress-heading"><div class="stage"><span id="status-orb" class="status-orb" aria-hidden="true"></span><span id="stage-label" role="status" aria-live="polite">正在准备</span></div><span id="progress-value">0%</span></div>
        <div class="progress-track" role="progressbar" aria-label="下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-bar" class="progress-fill"></div></div>
        <p id="transfer-detail" class="transfer-detail">请保持此页面打开</p>
        <p id="error-message" class="error-message" role="alert" hidden></p>
        <div class="actions">
          <button id="cancel-button" class="button secondary" type="button">取消下载</button>
          <button id="retry-button" class="button primary" type="button" hidden>重新下载</button>
          <button id="save-button" class="button primary" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4" /></svg>保存视频</button>
          <a id="result-link" class="button primary" href="#" hidden>保存视频</a>
          <button id="open-downloads" class="button secondary" type="button" hidden>查看浏览器下载</button>
        </div>
      </section>

      <p class="keep-open"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" /><path d="M10 9v4m0-6v.2" /></svg>视频准备完成前，请保持此页面打开。</p>
    </main>
    <footer class="page-footer"><span>Nori Save</span><span>让保存视频更简单</span></footer>
  </body>
</html>
